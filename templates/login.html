<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ConstructCorp ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --light-bg: #f8f9fa;
            --dark-text: #2c3e50;
            --gradient-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--gradient-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 15px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 1000px;
            width: 100%;
            min-height: 500px;
            display: flex;
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-form-section {
            flex: 1;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            /* Prevent flex item from overflowing */
        }

        .login-brand-section {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
            min-width: 0;
            /* Prevent flex item from overflowing */
        }

        .login-brand-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .brand-content {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .brand-logo {
            font-size: 3.5rem;
            margin-bottom: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            word-wrap: break-word;
        }

        .brand-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .feature-list {
            list-style: none;
            padding: 0;
            text-align: left;
            max-width: 250px;
            margin: 0 auto;
        }

        .feature-list li {
            padding: 8px 0;
            opacity: 0.8;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }

        .feature-list li i {
            margin-right: 10px;
            color: #ffffff;
            flex-shrink: 0;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: var(--dark-text);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .login-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
            width: 100%;
        }

        .form-label {
            font-weight: 600;
            color: var(--dark-text);
            margin-bottom: 8px;
            display: block;
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .form-control {
            width: 100%;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            padding: 15px 20px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
            box-sizing: border-box;
        }

        .form-control.with-icon {
            padding-left: 50px;
        }

        .form-control.with-icon-right {
            padding-right: 50px;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
            background: white;
            outline: none;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            z-index: 2;
            font-size: 1rem;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            z-index: 2;
            transition: color 0.3s ease;
            font-size: 1rem;
        }

        .password-toggle:hover {
            color: var(--secondary-color);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .forgot-password {
            text-align: right;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: var(--secondary-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
            color: #666;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 20px;
            position: relative;
        }

        .admin-register-link {
            display: inline-block;
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
            padding: 12px 25px;
            border: 2px solid var(--secondary-color);
            border-radius: 12px;
            transition: all 0.3s ease;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .admin-register-link:hover {
            background: var(--secondary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .alert {
            border-radius: 12px;
            border: none;
            padding: 15px 20px;
            margin-bottom: 20px;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .loading-spinner {
            display: none;
            margin-right: 10px;
        }

        .btn-login.loading .loading-spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            opacity: 0.7;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .login-container {
                max-width: 800px;
            }

            .login-form-section {
                padding: 35px 25px;
            }

            .login-brand-section {
                padding: 35px 25px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .login-container {
                flex-direction: column;
                border-radius: 15px;
                min-height: auto;
            }

            .login-brand-section {
                padding: 30px 20px;
                order: 1;
            }

            .login-form-section {
                padding: 30px 20px;
                order: 2;
            }

            .brand-title {
                font-size: 1.8rem;
            }

            .brand-logo {
                font-size: 2.5rem;
            }

            .brand-subtitle {
                font-size: 1rem;
            }

            .feature-list {
                max-width: 100%;
            }

            .feature-list li {
                font-size: 0.9rem;
                padding: 6px 0;
            }

            .login-header h2 {
                font-size: 1.6rem;
            }
        }

        @media (max-width: 576px) {
            .login-form-section {
                padding: 25px 15px;
            }

            .login-brand-section {
                padding: 25px 15px;
            }

            .form-control {
                padding: 12px 15px;
                font-size: 0.95rem;
            }

            .form-control.with-icon {
                padding-left: 45px;
            }

            .form-control.with-icon-right {
                padding-right: 45px;
            }

            .input-icon {
                left: 12px;
                font-size: 0.9rem;
            }

            .password-toggle {
                right: 12px;
                font-size: 0.9rem;
            }

            .btn-login {
                padding: 12px 25px;
                font-size: 1rem;
            }

            .admin-register-link {
                padding: 10px 20px;
                font-size: 0.95rem;
            }

            .brand-title {
                font-size: 1.5rem;
            }

            .brand-logo {
                font-size: 2rem;
            }
        }

        @media (max-width: 400px) {
            .login-form-section {
                padding: 20px 10px;
            }

            .login-brand-section {
                padding: 20px 10px;
            }
        }

        /* Landscape orientation for mobile */
        @media (max-height: 600px) and (orientation: landscape) {
            .login-container {
                flex-direction: row;
                min-height: 450px;
            }

            .login-brand-section {
                order: 1;
                padding: 20px 15px;
            }

            .login-form-section {
                order: 2;
                padding: 20px 15px;
            }

            .brand-logo {
                font-size: 2rem;
                margin-bottom: 10px;
            }

            .brand-title {
                font-size: 1.3rem;
            }

            .brand-subtitle {
                font-size: 0.9rem;
                margin-bottom: 15px;
            }

            .feature-list li {
                padding: 4px 0;
                font-size: 0.8rem;
            }

            .login-header {
                margin-bottom: 20px;
            }

            .login-header h2 {
                font-size: 1.4rem;
            }

            .form-group {
                margin-bottom: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <!-- Brand Section -->
        <div class="login-brand-section">
            <div class="brand-content">
                <div class="brand-logo">
                    <i class="fas fa-building"></i>
                </div>
                <h1 class="brand-title">SUPER ADMIN</h1>
                <p class="brand-subtitle">Civil ERP</p>
                <ul class="feature-list">
                </ul>
            </div>
        </div>

        <!-- Login Form Section -->
        <div class="login-form-section">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your account to continue</p>
            </div>

            <!-- Alert Container -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="container">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" name="email" id="email" class="form-control with-icon"
                            placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" id="password"
                            class="form-control with-icon with-icon-right" placeholder="Enter your password" required>
                        <i class="fas fa-eye password-toggle" id="passwordToggle" onclick="togglePassword()"></i>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-login">
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <div class="text-center"><a href="{{ url_for('register_super_admin') }}" class="admin-register-link">
                    <i class="fas fa-user-shield"></i> Register as Super Admin
                </a>
            </div>
            <!-- <a href="{{ url_for('create_user') }}">Create User</a>
                </a> -->
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                passwordToggle.className = 'fas fa-eye-slash password-toggle';
            } else {
                passwordField.type = 'password';
                passwordToggle.className = 'fas fa-eye password-toggle';
            }
        }

        // Remove this function
        function showForgotPassword() {
            alert('Password reset link will be sent to your email address.');
        }
    </script>
</body>

</html>
